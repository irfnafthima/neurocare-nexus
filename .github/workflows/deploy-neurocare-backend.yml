name: Deploy NeuroCare Nexus Backend to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build & Package Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Stage backend deployment package
        run: |
          # Create clean staging directory for deployment artifact
          mkdir -p deployment
          
          # Copy ONLY backend/ contents into deployment root, strictly excluding
          # local environment files, generated static assets, caches, and test artifacts.
          # Note: No virtual environment is packaged; Azure App Service Oryx builds
          # dependencies in the target Linux environment from requirements.txt.
          rsync -av \
            --exclude='.env*' \
            --exclude='staticfiles/' \
            --exclude='venv/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='*.pyo' \
            --exclude='.pytest_cache/' \
            --exclude='scratch/' \
            backend/ deployment/

      - name: Validate deployment package structure
        run: |
          # Ensure manage.py, requirements.txt, and core/asgi.py are located directly at the deployment root
          test -f deployment/manage.py || { echo "::error::manage.py missing from deployment root"; exit 1; }
          test -f deployment/requirements.txt || { echo "::error::requirements.txt missing from deployment root"; exit 1; }
          test -f deployment/core/asgi.py || { echo "::error::core/asgi.py missing from deployment root"; exit 1; }
          
          # Ensure sensitive or unwanted files are strictly excluded
          test ! -f deployment/.env || { echo "::error::.env was accidentally packaged"; exit 1; }
          test ! -d deployment/src || { echo "::error::frontend src was accidentally packaged"; exit 1; }
          test ! -d deployment/iot || { echo "::error::iot firmware was accidentally packaged"; exit 1; }
          test ! -d deployment/staticfiles || { echo "::error::staticfiles directory was accidentally packaged"; exit 1; }
          test ! -d deployment/venv || { echo "::error::virtual environment was accidentally packaged"; exit 1; }
          test ! -d deployment/scratch || { echo "::error::scratch directory was accidentally packaged"; exit 1; }
          
          echo "Package structure verified successfully: manage.py, requirements.txt, and core/asgi.py are at deployment root."

      - name: Upload backend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-package
          path: deployment
          retention-days: 7

  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download backend build artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-package
          path: ./deployment

      - name: Log in to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'neurocare-nexus-api-2026'
          package: ./deployment
